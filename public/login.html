<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ff6b6b">
  <title>一屿视频 - 登录</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="login-page">

    <div class="login-title-card">
      <div class="login-title-row">
        <div class="login-title-logo">🎬</div>
        <span class="login-title-text">一屿视频 · 欢迎回来</span>
      </div>
      <div class="login-title-sub">发现精彩 · 海量影视 · 每日更新</div>
    </div>

    <div class="login-announcement-card" id="login-announcement">
      <span class="login-announce-icon">📢</span>
      <div class="login-announce-text">
        欢迎使用一屿视频！默认已自动连接至云端服务器，如需自定义请在 App 内「我的-设置」中修改。
      </div>
    </div>

    <div class="login-form-card">
      <div class="auth-tabs">
        <div class="auth-tab active" data-mode="login" onclick="switchMode('login')">登录</div>
        <div class="auth-tab" data-mode="register" onclick="switchMode('register')">注册</div>
      </div>

      <!-- 登录表单 -->
      <div id="login-form">
        <div class="auth-field">
          <div class="auth-field-input">
            <span class="auth-field-icon">👤</span>
            <input type="text" id="login-account" placeholder="请输入用户名或手机号">
          </div>
        </div>
        <div class="auth-field">
          <div class="auth-field-input">
            <span class="auth-field-icon">🔒</span>
            <input type="password" id="login-password" placeholder="请输入密码">
          </div>
        </div>
        <button class="auth-submit-btn" type="button" id="login-btn" onclick="doLogin()">登 录</button>
        <p class="login-agreement">
          登录即表示同意 <a href="javascript:showAgreement('user')">《用户协议》</a> 和 <a href="javascript:showAgreement('privacy')">《隐私政策》</a>
        </p>
      </div>

      <!-- 注册表单 -->
      <div id="register-form" style="display:none;">
        <div class="auth-field">
          <div class="auth-field-input">
            <span class="auth-field-icon">👤</span>
            <input type="text" id="reg-username" placeholder="请输入用户名">
          </div>
        </div>
        <div class="auth-field">
          <div class="auth-field-input">
            <span class="auth-field-icon">📱</span>
            <input type="tel" id="reg-phone" placeholder="请输入手机号" maxlength="11">
          </div>
        </div>
        <div class="auth-field">
          <div class="auth-field-input">
            <span class="auth-field-icon">🐧</span>
            <input type="text" id="reg-qq" placeholder="请输入QQ号（选填）">
          </div>
        </div>
        <div class="auth-field">
          <div class="auth-field-input">
            <span class="auth-field-icon">🔒</span>
            <input type="password" id="reg-password" placeholder="请输入密码（至少6位）">
          </div>
        </div>
        <div class="auth-field">
          <div class="auth-field-input">
            <span class="auth-field-icon">🔐</span>
            <input type="password" id="reg-confirm" placeholder="请再次输入密码">
          </div>
        </div>
        <label class="reg-agreement-check" for="reg-agree">
          <input type="checkbox" id="reg-agree">
          <span>我已阅读并同意 <a href="javascript:showAgreement('user')">《用户协议》</a> 和 <a href="javascript:showAgreement('privacy')">《隐私政策》</a></span>
        </label>
        <button class="auth-submit-btn" type="button" id="reg-btn" onclick="doRegisterWithAgree()">注 册</button>
      </div>
    </div>

    <p class="login-bottom-author">作者：<strong>一屿</strong> · © 2026 一屿视频 All Rights Reserved</p>
  </div>

  <div class="toast" id="toast"></div>

  <script src="/js/config.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    // 检查登录状态
    (function checkAuth() {
      var token = localStorage.getItem('yiyu_token');
      if (token) {
        window.location.href = '/index.html';
      }
    })();

    function switchMode(mode) {
      var tabs = document.querySelectorAll('.auth-tab');
      tabs.forEach(function(t) {
        t.classList.toggle('active', t.dataset.mode === mode);
      });
      document.getElementById('login-form').style.display = mode === 'login' ? 'block' : 'none';
      document.getElementById('register-form').style.display = mode === 'register' ? 'block' : 'none';
    }

    function showToast(msg) {
      var t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(function() { t.classList.remove('show'); }, 1800);
    }

    // 注册前强制勾选协议
    function doRegisterWithAgree() {
      var chk = document.getElementById('reg-agree');
      if (!chk || !chk.checked) {
        showToast('请先阅读并同意《用户协议》和《隐私政策》');
        return;
      }
      doRegister();
    }
  </script>
</body>
</html>

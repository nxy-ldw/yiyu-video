<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>一屿视频 - 管理后台 V4.0</title>
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>

  <div id="login-view">
    <div class="admin-login-box">
      <div class="login-logo">🎬</div>
      <h2 class="login-title">一屿视频 管理后台</h2>
      <p class="login-subtitle">V4.0 管理员专属入口</p>
      <div class="login-form">
        <div class="login-field">
          <span class="login-icon">👤</span>
          <input type="text" id="admin-account" placeholder="用户名或手机号" class="login-input">
        </div>
        <div class="login-field">
          <span class="login-icon">🔒</span>
          <input type="password" id="admin-password" placeholder="登录密码" class="login-input" onkeypress="if(event.key==='Enter')adminLogin()">
        </div>
        <button class="login-btn" onclick="adminLogin()">登 录 后 台</button>
      </div>
      <div class="login-footer">一屿视频 © 2024 Admin Panel</div>
    </div>
  </div>

  <div id="admin-app" style="display:none;">
    <aside class="admin-sidebar">
      <div class="sidebar-brand">
        <span class="brand-icon">🎬</span>
        <div class="brand-text">
          <div class="brand-name">一屿视频后台</div>
          <div class="brand-version">V4.0</div>
        </div>
      </div>

      <nav class="sidebar-menu">
        <div class="menu-group">
          <div class="menu-group-title">📊 数据中心</div>
          <a class="menu-item active" data-page="dashboard" onclick="adminSwitchPage('dashboard')">
            <span class="menu-icon">�</span><span class="menu-text">仪表盘</span>
          </a>
        </div>

        <div class="menu-group">
          <a class="menu-item" data-page="users" onclick="adminSwitchPage('users')">
            <span class="menu-icon">👥</span><span class="menu-text">用户管理</span>
          </a>
        </div>

        <div class="menu-group">
          <div class="menu-group-title">📢 公告管理</div>
          <a class="menu-item" data-page="ann-home" onclick="adminSwitchPage('ann-home')">
            <span class="menu-icon">🏠</span><span class="menu-text">首页公告</span>
          </a>
          <a class="menu-item" data-page="ann-login" onclick="adminSwitchPage('ann-login')">
            <span class="menu-icon">🔐</span><span class="menu-text">登录页公告</span>
          </a>
        </div>

        <div class="menu-group">
          <a class="menu-item" data-page="sources" onclick="adminSwitchPage('sources')">
            <span class="menu-icon">📺</span><span class="menu-text">数据源管理</span>
          </a>
        </div>

        <div class="menu-group">
          <div class="menu-group-title">🎯 广告管理</div>
          <a class="menu-item" data-page="ads-banner" onclick="adminSwitchPage('ads-banner')">
            <span class="menu-icon">🖼️</span><span class="menu-text">首页Banner</span>
          </a>
          <a class="menu-item" data-page="ads-mine" onclick="adminSwitchPage('ads-mine')">
            <span class="menu-icon">�</span><span class="menu-text">我的页面广告</span>
          </a>
        </div>

        <div class="menu-group">
          <a class="menu-item" data-page="push" onclick="adminSwitchPage('push')">
            <span class="menu-icon">🔔</span><span class="menu-text">推送通知</span>
          </a>
        </div>

        <div class="menu-group">
          <a class="menu-item" data-page="feedback" onclick="adminSwitchPage('feedback')">
            <span class="menu-icon">💬</span><span class="menu-text">功能反馈</span>
          </a>
        </div>

        <div class="menu-group">
          <div class="menu-group-title">📜 日志管理</div>
          <a class="menu-item" data-page="logs-op" onclick="adminSwitchPage('logs-op')">
            <span class="menu-icon">⚙️</span><span class="menu-text">操作日志</span>
          </a>
          <a class="menu-item" data-page="logs-reg" onclick="adminSwitchPage('logs-reg')">
            <span class="menu-icon">📝</span><span class="menu-text">注册日志</span>
          </a>
        </div>

        <div class="menu-group">
          <a class="menu-item" data-page="server" onclick="adminSwitchPage('server')">
            <span class="menu-icon">🖥️</span><span class="menu-text">服务器控制</span>
          </a>
        </div>

        <div class="menu-group">
          <a class="menu-item" data-page="settings" onclick="adminSwitchPage('settings')">
            <span class="menu-icon">⚙️</span><span class="menu-text">系统设置</span>
          </a>
        </div>
      </nav>

      <div class="sidebar-bottom-spacer"></div>
    </aside>

    <div class="admin-main">
      <header class="admin-topbar">
        <div class="topbar-left">
          <span class="topbar-logo">🎬</span>
          <span class="topbar-title">一屿视频后台 V4.0</span>
        </div>
        <div class="topbar-right">
          <div class="admin-profile">
            <div class="admin-avatar" id="admin-avatar">A</div>
            <div class="admin-info">
              <div class="admin-name" id="admin-name">管理员</div>
              <div class="admin-role">超级管理员</div>
            </div>
            <button class="logout-btn" onclick="adminLogout()" title="退出登录">
              <span>🚪</span>
              <span class="logout-text">退出</span>
            </button>
          </div>
        </div>
      </header>

      <div class="admin-content-wrapper">
        <div class="breadcrumb-bar">
          <span class="breadcrumb-icon">�</span>
          <span class="breadcrumb-sep">/</span>
          <span id="breadcrumb-page">仪表盘</span>
        </div>
        <div id="admin-content"></div>
      </div>
    </div>
  </div>

  <div id="admin-modal" class="admin-modal" style="display:none;">
    <div class="modal-mask" onclick="hideModal()"></div>
    <div class="modal-dialog">
      <div class="modal-header">
        <div class="modal-title" id="modal-title">标题</div>
        <button class="modal-close" onclick="hideModal()">✕</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-footer" id="modal-footer">
        <button class="btn btn-default" onclick="hideModal()">取消</button>
        <button class="btn btn-primary" id="modal-ok-btn">确定</button>
      </div>
    </div>
  </div>

  <div id="admin-toast-wrap" class="admin-toast-wrap"></div>

  <script src="/js/config.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
